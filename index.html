<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Муравьиная империя — обновление 1</title>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#1b281c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Муравьи"><link rel="apple-touch-icon" href="./assets/icon-180.png">
<style>
html,body{margin:0;background:#0b100b;color:#f3e3b6;font-family:system-ui,Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none;background:#556f3f}
</style>
</head>
<body>
<canvas id="game" width="720" height="1280"></canvas>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),x=c.getContext('2d'); x.imageSmoothingEnabled=false;
const W=c.width,H=c.height;
const ui=[]; const TAU=Math.PI*2;
const G={scene:'surface', cooldown:0, t:0, cam:{x:0,y:0}, msg:'Коснись земли, чтобы идти', antType:'Командир',
 player:{x:0,y:0,tx:0,ty:0,dir:'down',moving:false,speed:120,step:0},
 res:{mush:0,leaf:0,resin:0,nectar:0},
 world:{giantTree:{x:500,y:-120,r:220},giantFlower:{x:-460,y:220,r:180}},
 tree:{player:{x:0,y:250,tx:0,ty:250,dir:'up',moving:false,speed:115,step:0}, resin:50000, termites:[]},
 flower:{player:{x:0,y:280,tx:0,ty:280,dir:'up',moving:false,speed:115,step:0}, nectar:500, bees:[{x:-140,y:-40,hp:500},{x:0,y:-90,hp:500},{x:140,y:-30,hp:500}]}
};
window.__antState=G;
for(let i=0;i<8;i++)G.tree.termites.push({x:(i%4)*70-105,y:70+Math.floor(i/4)*95,type:i<4?'worker':'warrior'});
const player=()=>G.scene==='surface'?G.player:G.scene==='tree'?G.tree.player:G.flower.player;
const rr=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rect=(x0,y0,w,h,col)=>{x.fillStyle=col;x.fillRect(Math.round(x0),Math.round(y0),Math.round(w),Math.round(h));};
const text=(s,x0,y0,sz=16,col='#f3e3b6',align='left')=>{x.fillStyle=col;x.font='bold '+sz+'px system-ui';x.textAlign=align;x.textBaseline='middle';x.fillText(s,Math.round(x0),Math.round(y0));};
function btn(x0,y0,w,h,label,fn,on=false){rect(x0,y0,w,h,on?'#5f7b3f':'#263726');x.strokeStyle=on?'#d7e7a6':'#70835d';x.lineWidth=2;x.strokeRect(x0,y0,w,h);text(label,x0+w/2,y0+h/2,17,'#fff','center');ui.push({x:x0,y:y0,w,h,fn});}
function bgSurface(){for(let yy=96;yy<H;yy+=48){for(let xx=0;xx<W;xx+=48){let v=Math.abs(Math.sin((xx+G.cam.x)*0.04+(yy+G.cam.y)*0.02));rect(xx,yy,48,48,v>.55?'#627e47':'#587140');if(v>.8)rect(xx+10,yy+10,7,7,'#93ad6a')}}}
function screen(wx,wy){return {x:W/2+(wx-G.cam.x),y:H*0.55+(wy-G.cam.y)}}
function world(sx,sy){return {x:G.cam.x+(sx-W/2),y:G.cam.y+(sy-H*0.55)}}
function moveActor(a,dt){let dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy); if(d>2){a.moving=true; let s=Math.min(d,a.speed*dt)/d; a.x+=dx*s; a.y+=dy*s; a.step+=dt*10; if(Math.abs(dx)>Math.abs(dy)) a.dir=dx>0?'right':'left'; else a.dir=dy>0?'down':'up'; } else a.moving=false;}

function antSprite(p,wx,wy,scale=4,kind='gray'){
 const s=screen(wx,wy), dir=p.dir||'down', bob=p.moving?Math.sin(p.step)*2:0, sx=Math.round(s.x), sy=Math.round(s.y+bob);
 const pal=kind==='gold'?['#000','#2b2317','#925321','#f4d09a','#fff6da'] : kind==='brown'?['#000','#2d170f','#6d2f18','#b4622c','#f7d497'] : ['#000','#222629','#505558','#a5a59e','#d7d7cd'];
 const dirs={
  down:{head:[-3,-8,6,6],thor:[-2,-1,4,6],abd:[-4,6,8,11],eye:1},
  up:{head:[-3,-10,6,6],thor:[-2,-2,4,6],abd:[-4,6,8,10],eye:0},
  left:{head:[-7,-8,6,6],thor:[-1,-3,6,4],abd:[4,0,9,8],eye:1},
  right:{head:[1,-8,6,6],thor:[-5,-3,6,4],abd:[-13,0,9,8],eye:1}
 };
 const d=dirs[dir];
 function pr(px,py,pw,ph,c){rect(sx+px*scale, sy+py*scale, pw*scale, ph*scale, c)}
 const legSwing = p.moving?Math.round(Math.sin(p.step)*2):0;
 // legs behind body
 if(dir==='down'||dir==='up'){
   for(let side of [-1,1]){
     pr(side*5- (side<0?2:0),-2+legSwing,2,10,pal[0]); pr(side*8- (side<0?2:0),0+legSwing,2,8,pal[0]);
     pr(side*5- (side<0?2:0),8-legSwing,2,10,pal[0]); pr(side*9- (side<0?2:0),10-legSwing,2,8,pal[0]);
     pr(side*4- (side<0?2:0),15+legSwing,2,9,pal[0]); pr(side*8- (side<0?2:0),20+legSwing,2,8,pal[0]);
   }
 } else {
   for(let row of [-5,2,9]){
     pr(-3,row,2,10,pal[0]); pr(1,row+legSwing,2,9,pal[0]);
     pr(-3,row+2,10,2,pal[0]);
   }
 }
 // body outline + fill
 pr(d.head[0],d.head[1],d.head[2],d.head[3],pal[0]); pr(d.head[0]+1,d.head[1]+1,d.head[2]-2,d.head[3]-2,pal[2]); pr(d.head[0]+2,d.head[1]+2,d.head[2]-4,d.head[3]-4,pal[3]);
 pr(d.thor[0],d.thor[1],d.thor[2],d.thor[3],pal[0]); pr(d.thor[0]+1,d.thor[1]+1,d.thor[2]-2,d.thor[3]-2,pal[2]);
 pr(d.abd[0],d.abd[1],d.abd[2],d.abd[3],pal[0]); pr(d.abd[0]+1,d.abd[1]+1,d.abd[2]-2,d.abd[3]-2,pal[2]); pr(d.abd[0]+2,d.abd[1]+2,d.abd[2]-4,d.abd[3]-4,pal[3]);
 // stripes/highlights
 if(dir==='down'||dir==='up'){pr(-2,9,4,1,pal[4]);pr(-2,13,4,1,pal[4]);pr(-2,17,4,1,pal[4]);}
 else {pr(d.abd[0]+2,d.abd[1]+2,1,d.abd[3]-4,pal[4]); pr(d.abd[0]+4,d.abd[1]+2,1,d.abd[3]-4,pal[4]);}
 // antennae
 if(dir==='down'){pr(-2,-13,1,6,pal[0]);pr(1,-13,1,6,pal[0]);pr(-5,-16,4,1,pal[0]);pr(2,-16,4,1,pal[0]);}
 if(dir==='up'){pr(-2,-14,1,6,pal[0]);pr(1,-14,1,6,pal[0]);pr(-6,-17,4,1,pal[0]);pr(3,-17,4,1,pal[0]);}
 if(dir==='left'){pr(-10,-10,5,1,pal[0]);pr(-10,-7,5,1,pal[0]);}
 if(dir==='right'){pr(5,-10,5,1,pal[0]);pr(5,-7,5,1,pal[0]);}
 // tiny eyes
 if(dir==='left'){pr(-6,-7,1,1,pal[4]);}
 if(dir==='right'){pr(4,-7,1,1,pal[4]);}
 if(dir==='down'){pr(-2,-7,1,1,pal[4]);pr(1,-7,1,1,pal[4]);}
 // commander ring
 if(G.scene==='surface' && p===G.player || G.scene!=='surface' && p===player()){
   x.strokeStyle='#ead57d'; x.lineWidth=3; x.beginPath(); x.arc(sx,sy+6,42,0,TAU); x.stroke();
 }
}

function giantTree(){ const t=G.world.giantTree, p=screen(t.x,t.y); 
 // shadow
 rect(p.x-260,p.y+380,520,65,'#304124');
 // trunk huge
 rect(p.x-128,p.y-100,256,540,'#4e3627'); rect(p.x-104,p.y-120,206,520,'#684931'); rect(p.x-72,p.y-100,22,470,'#856043'); rect(p.x+58,p.y+20,17,390,'#856043'); rect(p.x-38,p.y+20,18,310,'#74513a');
 // canopy fills big area
 const cols=['#31512c','#416238','#507646'];
 [[-430,-520,860,360],[-540,-300,440,240],[130,-300,450,230],[-500,-80,440,140],[70,-80,460,140],[-260,-640,520,170]].forEach((r,i)=>{rect(p.x+r[0],p.y+r[1],r[2],r[3],cols[i%3]); x.strokeStyle='#233a21'; x.strokeRect(p.x+r[0],p.y+r[1],r[2],r[3]);});
 text('ГИГАНТСКОЕ ДЕРЕВО',p.x,p.y-670,23,'#f6ebbf','center');
 if(Math.hypot(G.player.x-t.x,G.player.y-t.y)<220){text('Подойди ещё чуть-чуть — вход в локацию дерева',W/2,140,16,'#fff3c9','center');}
 }
 function giantFlower(){ const f=G.world.giantFlower, p=screen(f.x,f.y); rect(p.x-30,p.y-10,60,470,'#5d7f3c'); [[-280,-310,260,260,'#d88fcc'],[40,-310,260,260,'#e8a7d8'],[-130,-470,270,270,'#d883c2'],[-330,-105,220,200,'#e4a2d1'],[115,-100,220,200,'#d183c0']].forEach(r=>{rect(p.x+r[0],p.y+r[1],r[2],r[3],r[4]); x.strokeStyle='#7d3f6a'; x.strokeRect(p.x+r[0],p.y+r[1],r[2],r[3]);}); rect(p.x-75,p.y-220,150,150,'#efd882'); text('ГИГАНТСКИЙ ЦВЕТОК',p.x,p.y-505,23,'#f6ebbf','center'); }

function drawSurface(){ bgSurface(); giantTree(); giantFlower(); antSprite(G.player,G.player.x,G.player.y,5,'gray'); text('Поверхность',18,146,17,'#fff'); }
function drawTreeScene(){
  // bark background/arena
  for(let yy=96;yy<H;yy+=64){for(let xx=0;xx<W;xx+=64){rect(xx,yy,64,64,((xx+yy)/64)%2?'#7a5a3d':'#866346'); rect(xx+8,yy+8,6,48,'#916c4a')}}
  rect(40,150,640,930,'#7f5f41'); x.strokeStyle='#4e3827'; x.lineWidth=6; x.strokeRect(40,150,640,930);
  rect(280,180,160,140,'#9b754e'); text('ИСТОЧНИК СМОЛЫ',360,250,20,'#fff3c9','center');
  text('Локация дерева',18,146,17,'#fff');
  G.tree.termites.forEach(t=>antSprite({dir:'down',moving:false,step:G.t*5}, t.x, t.y,4, t.type==='worker'?'brown':'gold'));
  antSprite(G.tree.player,G.tree.player.x,G.tree.player.y,5,'gray');
 }
function drawFlowerScene(){
  for(let yy=96;yy<H;yy+=64){for(let xx=0;xx<W;xx+=64){rect(xx,yy,64,64,((xx+yy)/64)%2?'#49703f':'#557d46')}}
  rect(70,180,580,860,'#7eb264'); x.strokeStyle='#3e5a32'; x.lineWidth=6; x.strokeRect(70,180,580,860);
  [[250,220,220,220,'#df97d4'],[185,310,160,160,'#e3a6da'],[375,310,160,160,'#e3a6da'],[270,430,180,180,'#d983c5']].forEach(r=>{rect(r[0],r[1],r[2],r[3],r[4]); x.strokeStyle='#864f79'; x.strokeRect(r[0],r[1],r[2],r[3]);});
  rect(330,400,60,300,'#658a43'); rect(300,500,120,120,'#eed97d'); text('Локация цветка',18,146,17,'#fff');
  G.flower.bees.forEach(b=>{const p=screen(b.x,b.y); rect(p.x-28,p.y-18,56,36,'#000'); rect(p.x-22,p.y-14,44,28,'#f0be45'); rect(p.x-10,p.y-14,8,28,'#000'); rect(p.x+2,p.y-14,8,28,'#000');});
  antSprite(G.flower.player,G.flower.player.x,G.flower.player.y,5,'gray');
 }
 function top(){ rect(0,0,W,92,'#182218'); text('МУРАВЬИНАЯ ИМПЕРИЯ — ОБНОВЛЕНИЕ',18,24,20); text('Муравей: '+G.antType,18,56,18,'#e7f3c1'); text('🍄 '+G.res.mush+'   🍃 '+G.res.leaf+'   🟠 '+G.res.resin+'   🍯 '+G.res.nectar,710,56,18,'#fff','right'); }
 function bottom(){ rect(0,H-160,W,160,'#152015'); if(G.scene==='surface'){ btn(18,H-132,120,48,'Поверхность',()=>{},true); } else { btn(18,H-132,120,48,'Назад',()=>{G.scene='surface'; G.cooldown=3; const loc=G.player; const zone=(loc.x>0?G.world.giantTree:G.world.giantFlower); let dx=loc.x-zone.x,dy=loc.y-zone.y,dist=Math.hypot(dx,dy)||1;loc.x=zone.x+(dx/dist)*180;loc.y=zone.y+(dy/dist)*180;loc.tx=loc.x;loc.ty=loc.y;G.msg='Вернулся на поверхность';},false);} text(G.msg,18,H-78,16,'#dce8bf'); if(G.scene==='surface') text('Подойди к гигантскому дереву или цветку',18,H-48,15,'#cbdab1'); else if(G.scene==='tree') text('Это отдельная локация дерева — здесь идёт война за смолу',18,H-48,15,'#cbdab1'); else text('Это отдельная локация цветка — здесь хранится нектар',18,H-48,15,'#cbdab1'); }
 function update(dt){ G.t+=dt; G.cooldown=Math.max(0,G.cooldown-dt); let p=player(); moveActor(p,dt); if(G.scene==='surface'){ G.cam.x += (G.player.x-G.cam.x)*Math.min(1,dt*3); G.cam.y += (G.player.y-G.cam.y)*Math.min(1,dt*3); if(G.cooldown<=0 && Math.hypot(G.player.x-G.world.giantTree.x,G.player.y-G.world.giantTree.y)<95){ G.scene='tree'; G.msg='Ты вошёл в локацию гигантского дерева'; }
 if(G.cooldown<=0 && Math.hypot(G.player.x-G.world.giantFlower.x,G.player.y-G.world.giantFlower.y)<100){ G.scene='flower'; G.msg='Ты вошёл в локацию гигантского цветка'; }} else {G.cam.x += (p.x-G.cam.x)*Math.min(1,dt*3);G.cam.y += (p.y-G.cam.y)*Math.min(1,dt*3);} }
 function tap(sx,sy){ for(let i=ui.length-1;i>=0;i--){const a=ui[i]; if(sx>=a.x&&sx<=a.x+a.w&&sy>=a.y&&sy<=a.y+a.h){a.fn(); return;}} if(sy<92||sy>H-160)return; const w=world(sx,sy); let p=player(); p.tx=w.x; p.ty=w.y; }
 c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(); tap((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H); e.preventDefault();});
 function render(){ ui.length=0; x.clearRect(0,0,W,H); if(G.scene==='surface') drawSurface(); else if(G.scene==='tree') drawTreeScene(); else drawFlowerScene(); top(); bottom(); }
 let last=0; function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0); last=ts; update(dt); render(); requestAnimationFrame(loop);} requestAnimationFrame(loop);
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
</body>
</html>
