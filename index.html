    for(let yy=-2; yy<H/104+2; yy++)for(let xx=-2;xx<W/104+2;xx++)
      x.drawImage(ART.dirt,xx*104,yy*104,105,105);
    x.restore();
  }
}
function screen(wx,wy){return {x:W/2+(wx-G.cam.x),y:H*0.55+(wy-G.cam.y)}}
function world(sx,sy){return {x:G.cam.x+(sx-W/2),y:G.cam.y+(sy-H*0.55)}}
function collisionCircle(wx,wy){
  if(G.scene!=='surface')return null;
  for(const t of [{x:-135,y:465,r:72,name:'Ножка гриба'},
    {x:600,y:-180,r:95,name:'Ствол дерева'},
    {x:-540,y:-100,r:56,name:'Стебель цветка'}]){
    const d=Math.hypot(wx-t.x,wy-t.y);
    if(d<t.r)return {site:t,dist:d};
  }
  return null;
}
function moveActor(a,dt){
  const dx=a.tx-a.x,dy=a.ty-a.y,dist=Math.hypot(dx,dy);
  if(dist<=2){a.moving=false;return;}
  const step=Math.min(dist,a.speed*dt),ux=dx/dist,uy=dy/dist;
  let xx=a.x+ux*step,yy=a.y+uy*step;
  if(G.scene==='surface'){
    for(const t of [{x:-135,y:465,r:72},{x:600,y:-180,r:95},{x:-540,y:-100,r:56}]){
      let vx=xx-t.x,vy=yy-t.y,d=Math.hypot(vx,vy);
      if(d<t.r){
        const safe=Math.max(d,1);
        // Slide around stems/roots, never pass through them.
        xx=t.x+vx/safe*t.r;yy=t.y+vy/safe*t.r;
        if(Math.hypot(xx-a.x,yy-a.y)<.5){a.tx=a.x;a.ty=a.y;G.msg='Здесь препятствие: обойди его';}
      }
    }
  }
  a.moving=Math.hypot(xx-a.x,yy-a.y)>.15;
  if(a.moving){a.x=xx;a.y=yy;a.step+=dt*10;}
  if(Math.abs(dx)>Math.abs(dy))a.dir=dx>0?'right':'left'; else a.dir=dy>0?'down':'up';
}

function antSprite(p,wx,wy,scale=4,kind='gray'){
 const s=screen(wx,wy), dir=p.dir||'down', bob=p.moving?Math.sin(p.step)*2:0, sx=Math.round(s.x), sy=Math.round(s.y+bob);
 const pal=kind==='gold'?['#000','#2b2317','#925321','#f4d09a','#fff6da'] : kind==='brown'?['#000','#2d170f','#6d2f18','#b4622c','#f7d497'] : ['#000','#222629','#505558','#a5a59e','#d7d7cd'];
 const dirs={
  down:{head:[-3,-8,6,6],thor:[-2,-1,4,6],abd:[-4,6,8,11],eye:1},
  up:{head:[-3,-10,6,6],thor:[-2,-2,4,6],abd:[-4,6,8,10],eye:0},
  left:{head:[-7,-8,6,6],thor:[-1,-3,6,4],abd:[4,0,9,8],eye:1},
  right:{head:[1,-8,6,6],thor:[-5,-3,6,4],abd:[-13,0,9,8],eye:1}
 };
 const d=dirs[dir];
 function pr(px,py,pw,ph,c){rect(sx+px*scale, sy+py*scale, pw*scale, ph*scale, c)}
 const legSwing = p.moving?Math.round(Math.sin(p.step)*2):0;
 // legs behind body
 if(dir==='down'||dir==='up'){
   for(let side of [-1,1]){
     pr(side*5- (side<0?2:0),-2+legSwing,2,10,pal[0]); pr(side*8- (side<0?2:0),0+legSwing,2,8,pal[0]);
     pr(side*5- (side<0?2:0),8-legSwing,2,10,pal[0]); pr(side*9- (side<0?2:0),10-legSwing,2,8,pal[0]);
     pr(side*4- (side<0?2:0),15+legSwing,2,9,pal[0]); pr(side*8- (side<0?2:0),20+legSwing,2,8,pal[0]);
   }
 } else {
   for(let row of [-5,2,9]){
     pr(-3,row,2,10,pal[0]); pr(1,row+legSwing,2,9,pal[0]);
     pr(-3,row+2,10,2,pal[0]);
   }
 }
 // body outline + fill
 pr(d.head[0],d.head[1],d.head[2],d.head[3],pal[0]); pr(d.head[0]+1,d.head[1]+1,d.head[2]-2,d.head[3]-2,pal[2]); pr(d.head[0]+2,d.head[1]+2,d.head[2]-4,d.head[3]-4,pal[3]);
 pr(d.thor[0],d.thor[1],d.thor[2],d.thor[3],pal[0]); pr(d.thor[0]+1,d.thor[1]+1,d.thor[2]-2,d.thor[3]-2,pal[2]);
 pr(d.abd[0],d.abd[1],d.abd[2],d.abd[3],pal[0]); pr(d.abd[0]+1,d.abd[1]+1,d.abd[2]-2,d.abd[3]-2,pal[2]); pr(d.abd[0]+2,d.abd[1]+2,d.abd[2]-4,d.abd[3]-4,pal[3]);
 // stripes/highlights
 if(dir==='down'||dir==='up'){pr(-2,9,4,1,pal[4]);pr(-2,13,4,1,pal[4]);pr(-2,17,4,1,pal[4]);}
 else {pr(d.abd[0]+2,d.abd[1]+2,1,d.abd[3]-4,pal[4]); pr(d.abd[0]+4,d.abd[1]+2,1,d.abd[3]-4,pal[4]);}
 // antennae
 if(dir==='down'){pr(-2,-13,1,6,pal[0]);pr(1,-13,1,6,pal[0]);pr(-5,-16,4,1,pal[0]);pr(2,-16,4,1,pal[0]);}
 if(dir==='up'){pr(-2,-14,1,6,pal[0]);pr(1,-14,1,6,pal[0]);pr(-6,-17,4,1,pal[0]);pr(3,-17,4,1,pal[0]);}
 if(dir==='left'){pr(-10,-10,5,1,pal[0]);pr(-10,-7,5,1,pal[0]);}
 if(dir==='right'){pr(5,-10,5,1,pal[0]);pr(5,-7,5,1,pal[0]);}
 // tiny eyes
 if(dir==='left'){pr(-6,-7,1,1,pal[4]);}
 if(dir==='right'){pr(4,-7,1,1,pal[4]);}
 if(dir==='down'){pr(-2,-7,1,1,pal[4]);pr(1,-7,1,1,pal[4]);}
 // commander ring
 if(G.scene==='surface' && p===G.player || G.scene!=='surface' && p===player()){
   x.strokeStyle='#ead57d'; x.lineWidth=3; x.beginPath(); x.arc(sx,sy+6,42,0,TAU); x.stroke();
 }
}


function art(name,px,py,w,h){let im=ART[name];if(im.complete&&im.naturalWidth)x.drawImage(im,Math.round(px),Math.round(py),Math.round(w),Math.round(h));}
const SITES=[{id:'tree',x:600,y:-180,w:748,h:761,label:'ВЕЛИКОЕ ДЕРЕВО'},
{id:'flower',x:-540,y:-100,w:514,h:428,label:'ГИГАНТСКИЙ ЦВЕТОК'},
{id:'mushroom',x:-135,y:465,w:470,h:399,label:'ГИГАНТСКИЙ ГРИБ'}];
function treeArt(obj){const p=screen(obj.x,obj.y);let w=obj.w,h=obj.h;
  art(obj.id,p.x-w/2,p.y-h,w,h);
}
function plantLabel(obj){let p=screen(obj.x,obj.y),dy=obj.h;
  if(p.x<-150||p.x>W+150||p.y-dy>H-70)return;
  if(Math.hypot(G.player.x-obj.x,G.player.y-obj.y)<280)
    text(obj.label,clamp(p.x,70,W-70),clamp(p.y-dy-22,118,H-140),16,'#ffefba','center');
}
function drawBush(wx,wy,n){
  const q=screen(wx,wy),sz=22+(n%5)*6;
  if(q.x<-100||q.x>W+100||q.y<-130||q.y>H+70)return;
  const cols=['#183c29','#2c6333','#458a39','#6ea84c','#a2bb5c'];
  // Layer of separate pixel leaves, not a big rectangle.
  for(let k=0;k<5;k++){
    const lean=Math.sin(k*2.5+n)*sz*.42, top=q.y-sz*(1.2+((k+n)%3)*.32);
    for(let yy=0;yy<7;yy++){
      const curve=Math.sin((yy/6)*Math.PI); const ww=(6+sz*.35*curve)|0;
      const cx=q.x+lean+yy*1.5*((k%2)?-1:1);
      rect(cx-ww/2,top+yy*5,ww,6,cols[Math.min(4,Math.max(0,k+(yy%2)-1))]);
    }
  }
}
function hash(a,b){let n=(Math.imul(a,92837111)^Math.imul(b,689287499))>>>0; n^=n<<13;n^=n>>>17;n^=n<<5;return(n>>>0)/4294967295;}
function sceneSurface(){
  bgSurface();const o=[];
  for(const site of SITES)o.push({z:site.y,draw:()=>treeArt(site)});
  const bx0=Math.floor((G.cam.x-W/2-160)/220),bx1=Math.ceil((G.cam.x+W/2+160)/220);
  const by0=Math.floor((G.cam.y-H*.55-160)/220),by1=Math.ceil((G.cam.y+H*.55+160)/220);
  for(let iy=by0;iy<=by1;iy++)for(let ix=bx0;ix<=bx1;ix++){
    const h=hash(ix,iy);
    if(h<.61)continue;
    const wx=ix*220+35+hash(ix+51,iy)*90,wy=iy*220+hash(ix,iy+92)*120;
    if(Math.hypot(wx,wy)<190)continue;
    if(SITES.some(s=>Math.hypot(wx-s.x,wy-s.y)<85))continue;
    o.push({z:wy,draw:()=>drawBush(wx,wy,(ix*7+iy*11)&15)});
  }
  for(const w of G.workers)o.push({z:w.y,draw:()=>drawAnimatedAnt(w,w.x,w.y,'worker')});
  o.push({z:-70,draw:()=>{const p=screen(130,-70);art('warrior',p.x-28,p.y-55,56,105);}});
  o.push({z:G.player.y,draw:()=>drawAnimatedAnt(G.player,G.player.x,G.player.y,'commander')});
  o.sort((a,b)=>a.z-b.z);for(const item of o)item.draw();
  for(const site of SITES)plantLabel(site);
  text('Поверхность · лес',18,118,Math.min(17,W/36),'#fff4c6');
}
function drawSurface(){sceneSurface();}
// Atlas-driven 4-direction walking (two authored sprite frames per direction).
// Independent procedural pixel legs add smooth 60 FPS motion between frame changes.
function antPixelLeg(ax,ay,bx,by,color,px){
  const count=Math.max(2,Math.ceil(Math.hypot(bx-ax,by-ay)/5));
  for(let i=0;i<=count;i++){
    const t=i/count;
    rect(ax+(bx-ax)*t-px/2,ay+(by-ay)*t-px/2,px,px,color);
  }
}
function drawAnimatedAnt(a,wx,wy,kind='worker'){
  const q=screen(wx,wy),soldier=kind==='commander';
  const walking=!!a.moving,phase=a.step||0,dir=a.dir||'up';
  const row=soldier?0:1,base={up:0,down:2,left:4,right:6}[dir]||0;
  const frame=walking?(Math.floor(phase/0.83)%2):0;
  const sizeW=soldier?92:66,sizeH=soldier?132:95;
  const bob=walking?Math.sin(phase*1.9)*1.6:0;
  const sway=walking?Math.sin(phase*1.15)*0.035:0;
  x.save();x.translate(Math.round(q.x),Math.round(q.y+bob));
  x.rotate(sway); // Atlas already contains all four correctly oriented directions.
  // Shadow under feet (not rotated with sprite).
  x.globalAlpha=0.24;rect(-sizeW*.35,sizeH*.35,sizeW*.70,12,'#11180e');x.globalAlpha=1;
  // Animate three pairs in alternating tripod gait; extend past original sprite legs.
  const scale=soldier?0.88:0.62;
  for(let pair=0;pair<3;pair++){
    for(let side of [-1,1]){
      const offset=pair*1.98+(side===1?Math.PI:0);
      const gait=walking?Math.sin(phase*2.7+offset):0;
      const lift=walking?Math.max(0,Math.sin(phase*2.7+offset))*6:0;
      const bodyY=([-28,0,29][pair])*scale;
      const rootX=side*15*scale;
      const kneeX=side*(31+gait*4)*scale;
      const kneeY=bodyY+([-9,3,13][pair])*scale-lift;
      const tipX=side*(47+gait*7)*scale;
      const tipY=bodyY+([-17,7,25][pair])*scale-lift*1.6;
      antPixelLeg(rootX,bodyY,kneeX,kneeY,'#20140f',soldier?6:4);
      antPixelLeg(kneeX,kneeY,tipX,tipY,'#582a17',soldier?6:4);
      rect(tipX-2,tipY-2,soldier?6:4,soldier?6:4,'#20140f');
    }
  }
  // Two authored movement frames switch at footfalls; large rotations keep head
  // in the actual direction of movement instead of leaving it pointing upward.
  if(WALK_SHEET.complete&&WALK_SHEET.naturalWidth){
    x.drawImage(WALK_SHEET,(base+frame)*104,row*150,104,150,
      Math.round(-sizeW/2),Math.round(-sizeH/2),sizeW,sizeH);
  }else{
    // Stay playable even if the sprite sheet hasn't decoded yet.
    rect(-10,-20,20,60,'#66351f');
  }
  x.restore();
  if(a===player()){
    x.strokeStyle='#ead57d';x.lineWidth=3;
    x.beginPath();x.ellipse(q.x,q.y+14,soldier?36:27,soldier?17:14,0,0,TAU);x.stroke();
  }
  if(a.carrying){
    // A tiny morsel (one resource unit) is held at the worker's jaws.
    const direction={up:[0,-38],down:[0,38],left:[-33,-7],right:[33,-7]}[dir];
    const col=a.target==='flower'?'#f9a6d6':'#d7b68d';
    rect(q.x+direction[0]-6,q.y+direction[1]-6,12,12,'#30211a');
    rect(q.x+direction[0]-4,q.y+direction[1]-4,8,8,col);
  }
}

function drawWorkers(){
  for(const worker of G.workers) drawAnimatedAnt(worker,worker.x,worker.y,'worker');
}

function drawTreeScene(){
  rect(0,0,W,H,'#6b482d');
  if(ART.bark.complete&&ART.bark.naturalWidth){for(let y=86;y<H;y+=118)for(let xx=0;xx<W;xx+=140)
    x.drawImage(ART.bark,xx,y,141,119);}
  rect(W/2-95,140,190,120,'#5b311b');
  rect(W/2-82,148,164,95,'#b0793e');
  text('СМОЛА · 50 000',W/2,203,19,'#ffdf92','center');
  G.tree.termites.forEach(t=>antSprite({dir:'down',moving:false,step:G.t*5},t.x,t.y,2.3,t.type==='worker'?'brown':'gold'));
  drawAnimatedAnt(G.tree.player,G.tree.player.x,G.tree.player.y,'commander');
  text('Внутри дерева',18,118,17,'#fff3c4');
}
function drawFlowerScene(){
  bgSurface();
  if(ART.flower.complete&&ART.flower.naturalWidth){
    x.globalAlpha=.85;const q=screen(0,0);x.drawImage(ART.flower,q.x-275,q.y-355,550,458);x.globalAlpha=1;
  }
  G.flower.bees.forEach(b=>{const p=screen(b.x,b.y);rect(p.x-16,p.y-10,32,20,'#241a09');rect(p.x-12,p.y-9,24,18,'#f6c848');rect(p.x-5,p.y-10,5,18,'#241a09');rect(p.x+5,p.y-10,4,18,'#241a09');});
  drawAnimatedAnt(G.flower.player,G.flower.player.x,G.flower.player.y,'commander');
  text('Внутри цветка',18,118,17,'#fff3c4');
}
const HUD=93;
function top(){
  rect(0,0,W,HUD,'#10251b');rect(0,HUD-3,W,3,'#568347');
  text('МУРАВЬИНАЯ ИМПЕРИЯ',14,24,W<530?17:22,'#f0e5bd');
  text('Муравей: '+G.antType,14,62,W<530?14:17,'#d1e5ab');
  text('🍄'+G.res.mush+'  🍃'+G.res.leaf+'  🟠'+G.res.resin+'  🍯'+G.res.nectar,W-14,62,W<600?13:16,'#fff9d9','right');
}
function bottom(){
  const bar=H<650?104:124;
  rect(0,H-bar,W,bar,'#12241a');rect(0,H-bar,W,3,'#57834c');
  if(G.scene!=='surface'){
    btn(14,H-bar+16,115,39,'← Назад',()=>{
      const from=G.scene;G.scene='surface';G.cooldown=2.5;
      const loc=G.player,site=from==='tree'?G.world.giantTree:G.world.giantFlower;
      loc.x=site.x+180;loc.y=site.y+125;loc.tx=loc.x;loc.ty=loc.y;
      G.msg='Ты вернулся на поверхность';
    });
  }else btn(14,H-bar+16,110,39,'Лес 🌿',()=>{G.msg='Исследуй мир, приближайся к основаниям растений';},true);
  text(G.msg,138,H-bar+36,Math.min(16,W/42),'#e9f3cd');
  text(G.scene==='surface'?'5 рабочих собирают по одному кусочку · коснись земли, чтобы идти':
    G.scene==='tree'?'Локация дерева: термиты охраняют смолу':'Локация цветка: здесь живут пчёлы',14,H-21,W<560?13:15,'#b9d3a9');
}
 function workUpdate(dt){for(const w of G.workers){let dest=w.carrying?{x:0,y:0}:w.target==='flower'?{x:-540,y:5}:{x:-135,y:565};w.tx=dest.x;w.ty=dest.y;moveActor(w,dt);if(Math.hypot(w.x-dest.x,w.y-dest.y)<10){if(w.carrying){G.res[w.target==='flower'?'nectar':'mush']++;w.carrying=false;}else if(w.target==='flower'?G.flowerStock>0:G.mushroomStock>0){w.carrying=true;if(w.target==='flower')G.flowerStock--;else G.mushroomStock--;}}}}
function update(dt){ G.t+=dt; if(G.scene==='surface')workUpdate(dt); G.cooldown=Math.max(0,G.cooldown-dt); let p=player(); moveActor(p,dt); if(G.scene==='surface'){ G.cam.x += (G.player.x-G.cam.x)*Math.min(1,dt*4); G.cam.y += (G.player.y-G.cam.y)*Math.min(1,dt*4); if(G.cooldown<=0 && Math.hypot(G.player.x-G.world.giantTree.x,G.player.y-G.world.giantTree.y)<111){ G.scene='tree'; G.msg='Ты вошёл в локацию гигантского дерева'; }
 if(G.cooldown<=0 && Math.hypot(G.player.x-G.world.giantFlower.x,G.player.y-G.world.giantFlower.y)<93){ G.scene='flower'; G.msg='Ты вошёл в локацию гигантского цветка'; }} else {G.cam.x += (p.x-G.cam.x)*Math.min(1,dt*3);G.cam.y += (p.y-G.cam.y)*Math.min(1,dt*3);} }
function tap(sx,sy){
  for(let i=ui.length-1;i>=0;i--){const a=ui[i];if(sx>=a.x&&sx<=a.x+a.w&&sy>=a.y&&sy<=a.y+a.h){a.fn();return;}}
  if(sy<HUD||sy>H-(H<650?104:124))return;
  const w=world(sx,sy),p=player();
  if(G.scene==='surface'){
    const m=G.world.giantMushroom;
    // The cap is elevated; touching it sends the ant to the base, not onto its top.
    const capX=(w.x-m.x)/235,capY=(w.y-(m.y-265))/102;
    if(capX*capX+capY*capY<1.15){
      p.tx=m.x-95;p.ty=m.y+54;G.msg='Шляпка высоко! Иди к ножке гриба.';return;
    }
  }
  p.tx=w.x;p.ty=w.y;
}
 c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(); tap((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H); e.preventDefault();});
 function render(){ ui.length=0; x.clearRect(0,0,W,H); if(G.scene==='surface') drawSurface(); else if(G.scene==='tree') drawTreeScene(); else drawFlowerScene(); top(); bottom(); }
 let last=0; function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0); last=ts; update(dt); render(); requestAnimationFrame(loop);} requestAnimationFrame(loop);
window.__antDebug={get:()=>G,tap,step:update,collision:collisionCircle,resize:resizeCanvas};
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
