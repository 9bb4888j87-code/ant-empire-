for(let i=0;i<7;i++){let a=actor(i<4?'termite_worker':'termite_warrior',i*80-220,-120+(i%3)*115);a.homeX=a.x;a.homeY=a.y;state.enemies.push(a)}

function move(a,dt){let dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d>2){let f=Math.min(d,a.speed*dt)/d;a.x+=dx*f;a.y+=dy*f;a.walk+=dt*8.5;a.moving=true;let angle=Math.atan2(dy,dx);a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}else a.moving=false;}
function picName(kind){return kind==='soldier'?'commander':kind==='bee'?'termite_warrior':kind;}
function drawActor(a,sx,sy,scale=1,selected=false){if(!a||a.hp<=0)return;let w=(a.kind==='worker'?61:74)*scale,h=(a.kind==='worker'?91:109)*scale,phase=a.moving?Math.floor(a.walk)%2:0;
let orient=({up:0,down:2,left:4,right:6})[a.dir]||0;let key=picName(a.kind)+'_'+(orient+phase);
if(selected){ctx.strokeStyle='#f1dd7c';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(sx,sy+15*scale,43*scale,17*scale,0,0,TAU);ctx.stroke()}

if(a.kind==='soldier'){rect(sx-17*scale,by+8*scale,34*scale,5*scale,'#d28646');rect(sx-13*scale,by+14*scale,26*scale,3*scale,'#3c2217')}
if(a.carry){let cx=sx,cy=by-9*scale;let color=a.carry==='mush'?'#d54d34':a.carry==='leaf'?'#7eb845':a.carry==='resin'?'#dc9937':'#edda65';rect(cx-10*scale,cy-8*scale,20*scale,16*scale,'#221910');rect(cx-8*scale,cy-6*scale,16*scale,12*scale,color);if(a.carry==='mush'){rect(cx-4*scale,cy-6*scale,5*scale,4*scale,'#ffefc8')}}
if(a.hp<a.max&&a.hp>0){rect(sx-29*scale,by-12*scale,58*scale,7*scale,'#2d1412');rect(sx-28*scale,by-11*scale,56*scale*(a.hp/a.max),5*scale,'#a4cf78')}
}
function ground(scene='grass'){rect(0,0,W,H,'#567740');let step=112, sx=(state.cam.x%step+step)%step, sy=(state.cam.y%step+step)%step;
for(let y=-1;y<=Math.ceil(H/step)+1;y++)for(let x=-1;x<=Math.ceil(W/step)+1;x++){let px=x*step-sx,py=y*step-sy;tex(scene,px,py,step+1,step+1)}
}
const camera=(xx,yy)=>({x:W/2+xx-state.cam.x,y:H*.54+yy-state.cam.y});
function drawWorldImage(name,wx,wy,width,height){let p=camera(wx,wy);spr(name,p.x-width/2,p.y-height,width,height);return p;}
function scenery(){
 const m=state.world.mushroom,f=state.world.flower,t=state.world.tree;
 // The entire mushroom is ~8x the worker in height, with real pixel textures.
 let pos=drawWorldImage('mushroom',m.x,m.y,650,580);
 if(Math.abs(pos.x-W/2)<760&&Math.abs(pos.y-H/2)<900){label(`ГРИБ • ${m.stock}`,pos.x,pos.y-595,20,'#ffebb6','center')}
 pos=drawWorldImage('flower',f.x,f.y,730,740);
 if(Math.abs(pos.x-W/2)<900&&Math.abs(pos.y-H/2)<1000)label('ГИГАНТСКИЙ ЦВЕТОК',pos.x,pos.y-745,19,'#ffe1ec','center');
 pos=drawWorldImage('tree',t.x,t.y,1160,1120);
 if(Math.abs(pos.x-W/2)<920&&Math.abs(pos.y-H/2)<1100)label('ГИГАНТСКОЕ ДЕРЕВО',pos.x,pos.y-1140,21,'#eeefbc','center');
 // entrance/anthill - natural dirt ring instead of giant rectangle
 const n=camera(state.world.nest.x,state.world.nest.y);ctx.fillStyle='#342719';ctx.beginPath();ctx.ellipse(n.x,n.y,86,52,0,0,TAU);ctx.fill();ctx.fillStyle='#160e09';ctx.beginPath();ctx.ellipse(n.x,n.y-8,53,25,0,0,TAU);ctx.fill();label('МУРАВЕЙНИК',n.x,n.y+65,17,'#f1dfac','center');
}
function backgroundPattern(what){let key=what==='tree'?'bark':what==='flower'?'grass':'soil';ground(key)}
function drawSurface(){ground('grass');scenery();state.workers.forEach(a=>{const p=camera(a.x,a.y);if(p.x>-100&&p.x<W+100&&p.y>0&&p.y<H+110)drawActor(a,p.x,p.y,.72)});
state.soldiers.forEach(a=>{const p=camera(a.x,a.y);if(p.x>-100&&p.x<W+100&&p.y>0&&p.y<H+110)drawActor(a,p.x,p.y,.82)});
const p=camera(state.commander.x,state.commander.y);drawActor(state.commander,p.x,p.y,1,true);
}
function drawTree(){backgroundPattern('tree');
// dark vertical bark crevices, moss and a high-res resin deposit from real artwork
for(let i=0;i<15;i++){let xx=(i*163+17)%W;rect(xx,165,8+((i*7)%8),990,'#5c4128');rect(xx+4,165,3,990,'#b07b4c')}
const location={x:360,y:410};tex('resin',location.x-137,location.y-122,274,245);label('ИСТОЧНИК СМОЛЫ',location.x,location.y-153,23,'#ffdc8c','center');label('50 000 единиц',location.x,location.y+148,20,'#fbe1ae','center');
state.enemies.forEach(a=>drawActor(a,W/2+a.x,H*.54+a.y,.73));

function drawFlower(){ground('grass');

for(let i=0;i<3;i++){let xx=148+i*200,yy=260+(i%2)*100;let bee={kind:'bee',hp:500,max:500,dir:'right',moving:true,walk:state.t*4};drawActor(bee,xx,yy,.57)}

}
function drawNest(){ground('soil');
// 32x32 diggable cells, with 8x10 visible around camera, room plots
const tw=64;const ox=360-16*tw,oy=690-16*tw;for(let j=0;j<32;j++)for(let i=0;i<32;i++){let xx=ox+i*tw,yy=oy+j*tw;if(xx<-70||xx>W+70||yy<92||yy>H-180)continue;let dug=state.ground[j][i];if(!dug){rect(xx,yy,tw-2,tw-2,'#33241b');rect(xx+6,yy+6,8,7,'#654937')}else{rect(xx,yy,tw-2,tw-2,'#a67c50');rect(xx+10,yy+36,15,4,'#b48b5d')}}
const roomPoints=[[15,15],[12,16],[18,16],[14,18],[21,16],[22,18],[19,19],[16,20],[11,19],[23,20],[14,22],[19,22]];
rooms.forEach((name,i)=>{if(!state.rooms[name])return;const [ix,jy]=roomPoints[i],px=ox+ix*tw,py=oy+jy*tw;rect(px-30,py-21,tw*2.3,tw+34,i===0?'#725035':i===1?'#60754b':'#705b41');rect(px-30,py-21,tw*2.3,4,'#d6b477');label(name,px+42,py+3,14,'#fff0d2','center');label('ур. '+state.rooms[name],px+42,py+27,13,'#ebdbbc','center')});
// queen sprite
spr('worker_0',280,585,65,92);label('КОРОЛЕВА • '+state.queen.hp+' HP',355,705,17,'#ffebae','center');
label('Нажми на тёмную клетку — рабочие выкопают ход',360,181,16,'#f6ebbc','center');
}
let nestMode=false;
function ui(){control.length=0;
rect(0,0,W,124,'#192719');rect(0,122,W,3,'#a4bb80');label('МУРАВЬИНАЯ ИМПЕРИЯ · V3',18,24,22,'#f6eed4');label('Муравей: '+(state.scene==='nest'?'Командир в гнезде':units.commander.name)+'  •  Ур. '+state.level,18,60,17,'#dcf0bc');
label('🍄 '+state.resources.mush+'   🍃 '+state.resources.leaf+'   🟠 '+state.resources.resin+'   🍯 '+state.resources.nectar,18,97,18,'#fff2cf');
rect(0,H-202,W,202,'#192719');rect(0,H-202,W,3,'#b0bd81');
if(state.scene==='surface'){
 button(13,H-190,158,60,'🏠 Гнездо',()=>{state.scene='nest';state.commander.x=0;state.commander.y=145;msg('Подземное гнездо')});
 button(182,H-190,164,60,'⚔️ Воин',()=>recruit('soldier'));

 }else if(state.scene==='nest'){

 button(182,H-190,165,60,'⛏ Копать',()=>{state.mode='dig';msg('Нажми на клетку для раскопки')},state.mode==='dig');

 } else {

 }
label(`Рабочих: ${state.workers.length}   Воинов: ${state.soldiers.length}   Яиц: ${state.eggs.length}`,17,H-95,19,'#e5f0d0');
label(state.message.slice(0,75),17,H-49,16,'#f7ddac');

function recruit(kind){const cost=kind==='worker'?1:15,time=kind==='worker'?30:10;if(state.resources.mush<cost){msg('Недостаточно грибов: нужно '+cost);return}if(state.eggs.length>=3*(state.rooms['Инкубатор']||1)){msg('Инкубатор заполнен');return}state.resources.mush-=cost;state.eggs.push({kind,t:time});msg((kind==='worker'?'Рабочий':'Воин')+' будет выращен за '+time+' сек');save()}
function buildRoom(){let name=rooms[state.selectedRoom];if(state.rooms[name]){msg(name+' уже построена. Выбери другую.');return}if(state.resources.leaf<2400){msg(name+': нужно 2400 листьев');return}state.resources.leaf-=2400;state.rooms[name]=1;msg('Построена комната: '+name);save()}
function collect(){if(state.scene==='tree'){state.resources.resin+=1;msg('Командир собрал 1 смолу')}else if(state.scene==='flower'){if(state.world.flower.stock){state.world.flower.stock--;state.resources.nectar++;msg('Собрана 1 капля нектара')}else msg('Нектара больше нет')}save()}
function setTask(a,x,y,task){a.tx=x;a.ty=y;a.task=task;}
function workerAI(dt){const base=state.world.nest,m=state.world.mushroom;for(let a of state.workers){if(a.task==='toMush'&&dist(a,m)<44){if(m.stock>0){m.stock--;a.carry='mush';setTask(a,base.x+(Math.random()-.5)*36,base.y+15,'toNest')}else setTask(a,base.x,base.y,'wait')}
else if(a.task==='toNest'&&dist(a,base)<55){if(a.carry){state.resources[a.carry]++;a.carry=null}setTask(a,m.x+r(-20,20),m.y,'toMush')}
else if(a.task==='wait'&&m.stock>0)setTask(a,m.x,m.y,'toMush');move(a,dt)}
for(let a of state.soldiers){if(a.task==='follow'){a.tx=state.commander.x+r(-10,10);a.ty=state.commander.y+85;move(a,dt)}}
}
function eggAI(dt){if(!state.eggs.length)return;const e=state.eggs[0];e.t-=dt;if(e.t<=0){state.eggs.shift();if(e.kind==='worker'){const a=actor('worker',r(-22,22),35);setTask(a,state.world.mushroom.x,r(-20,20),'toMush');state.workers.push(a)}else{let a=actor('soldier',r(-35,35),95);a.task='follow';state.soldiers.push(a)}msg('Вылупился '+(e.kind==='worker'?'рабочий':'воин')+'!');save()}}
function battleAI(dt){if(state.scene!=='tree'||!state.battle)return;const p=state.commander;for(let enemy of state.enemies){if(enemy.hp<=0)continue;const dd=dist(p,enemy);enemy.attackCooldown-=dt;p.attackCooldown-=dt;if(dd<135&&p.attackCooldown<=0){enemy.hp-=p.attack*0.5;p.attackCooldown=.48;if(enemy.hp<=0){state.xp+=enemy.kind==='termite_worker'?5:15;let needed=state.level*55;if(state.xp>=needed){state.xp-=needed;state.level++;msg('Новый уровень: '+state.level)}}}if(dd<120&&enemy.attackCooldown<=0){p.hp-=enemy.attack*.35;enemy.attackCooldown=1.2}if(p.hp<=0){p.hp=p.max;state.scene='surface';p.x=0;p.y=130;p.tx=0;p.ty=130;msg('Командир отступил в муравейник');break}}
}
function update(dt){state.t+=dt;state.cooldown=Math.max(0,(state.cooldown||0)-dt);workerAI(dt);eggAI(dt);saveT+=dt;if(saveT>20){saveT=0;save()}if(state.scene==='surface'){
move(state.commander,dt);state.cam.x+=(state.commander.x-state.cam.x)*Math.min(1,dt*4);state.cam.y+=(state.commander.y-state.cam.y)*Math.min(1,dt*4);
let p=state.commander;
if(state.cooldown<=0&&dist(p,state.world.tree)<200){enter('tree')}else if(state.cooldown<=0&&dist(p,state.world.flower)<115){enter('flower')}
}else if(state.scene==='tree'||state.scene==='flower'){move(state.commander,dt);battleAI(dt)}
for(let j=state.digJobs.length-1;j>=0;j--){let job=state.digJobs[j];job.t-=dt;if(job.t<=0){state.ground[job.y][job.x]=1;state.digJobs.splice(j,1);msg('Рабочие выкопали клетку '+job.x+':'+job.y)}}}
function enter(where){state.scene=where;state.sceneReturn=where;state.commander.x=0;state.commander.y=330;state.commander.tx=0;state.commander.ty=330;state.cooldown=2;msg(where==='tree'?'Локация огромного дерева • термиты охраняют смолу':'Локация гигантского цветка • осторожно, пчёлы')}
function draw(){if(state.scene==='surface')drawSurface();else if(state.scene==='tree')drawTree();else if(state.scene==='flower')drawFlower();else drawNest();ui();if(!artReady){rect(90,360,540,110,'#21371c');label('Загружаются пиксельные текстуры…',360,413,24,'#f3e9c3','center')}}
function hit(px,py){for(let i=control.length-1;i>=0;i--){const b=control[i];if(px>=b.x&&px<b.x+b.w&&py>=b.y&&py<b.y+b.h){b.fn();return}}
if(py<125||py>H-202)return;
if(state.scene==='surface'){state.commander.tx=state.cam.x+px-W/2;state.commander.ty=state.cam.y+py-H*.54;msg('Командир идёт к цели')}
else if(state.scene==='nest'){
const tw=64,ox=360-16*tw,oy=690-16*tw,i=Math.floor((px-ox)/tw),j=Math.floor((py-oy)/tw);
if(i>=0&&i<32&&j>=0&&j<32){if(state.ground[j][i])msg('Этот тоннель уже выкопан');else if(!state.digJobs.some(k=>k.x===i&&k.y===j)){state.digJobs.push({x:i,y:j,t:5});msg('Рабочие копают: '+i+':'+j)}}
}else{state.commander.tx=px-W/2;state.commander.ty=py-H*.54;msg('Командир движется')}}
cv.addEventListener('pointerdown',e=>{let rr=cv.getBoundingClientRect();hit((e.clientX-rr.x)/rr.width*W,(e.clientY-rr.y)/rr.height*H);e.preventDefault()});
let last=0;function frame(ms){try{const dt=Math.min(.06,(ms-last)/1000||0);last=ms;update(dt);draw();requestAnimationFrame(frame)}catch(e){let er=document.getElementById('err');er.style.display='block';er.textContent='Ошибка игры: '+String(e);console.error(e)}}
requestAnimationFrame(frame);
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.__antState=state;window.__antArt=A;
})();
</script></body></html>
