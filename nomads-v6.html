};

const aiColonies=[
{x:-1250,y:450,name:'Красные челюсти',size:90,relation:-100,known:false,scout:null,raid:[],phase:'scout',cooldown:0,status:'war'},

];let diplomacyClock=0;

const addNode=(kind,x,y,amount)=>{
 const n={kind,x,y,amount,max:amount,id:++eid,guard:false,beeCount:0,beeCheck:0,flowerHours:0,scale:1,hitR:34,trunkW:0,trunkH:0};

function drawPixelTree(g,n,withResin){
 if(FOREST_SPRITES.complete&&FOREST_SPRITES.naturalWidth){
  const ix=withResin?3+(n.id%2):n.id%3;
  const scale=n.scale|| (withResin?1.9:1.75);
  const dw=Math.round(176*scale), dh=Math.round(206*scale);
  const baseY=Math.round(n.y+24), left=Math.round(n.x-dw/2), top=Math.round(baseY-dh);
  g.save();g.imageSmoothingEnabled=false;
  g.fillStyle='rgba(5,16,10,.36)';g.beginPath();g.ellipse(n.x,baseY+7,dw*.19,dh*.07,0,0,TAU);g.fill();
  g.drawImage(FOREST_SPRITES,ix*176,0,176,206,left,top,dw,dh);
  // Root grass and bark depth around the trunk base so giant trees feel anchored in the world.
  for(let i=0;i<10;i++){
   const px=n.x-dw*.14+i*(dw*.028);
   const h=4+((i*7+n.id)%6);
   g.fillStyle=i%2?'#214424':'#2f5c2f'; g.fillRect(Math.round(px),baseY-h,3,h);
   if(i%3===0){g.fillStyle='#7db564';g.fillRect(Math.round(px+1),baseY-h+1,1,Math.max(1,h-1))}
  }
  g.restore();return;
 }
 spriteArt(g,withResin?'treecrack':'tree',n.x,n.y,194,0);
}

 // atlas forms are drawn at native body aspect ratio; animated ants reuse their own leg texture slices.

canvas.addEventListener('pointerup',e=>{if(!activePointers.has(e.pointerId))return;activePointers.delete(e.pointerId);if(!pointerStart||pointerStart.moved){pointerStart=null;return}let rect=canvas.getBoundingClientRect(),p=screenToWorld(e.clientX-rect.left,e.clientY-rect.top);pointerStart=null;

 }
 if(view==='nest'&&digMode){let gx=Math.floor(p.x/digUnit),gy=Math.floor(p.y/digUnit);let count=0;for(let ix=gx-1;ix<=gx+1;ix++)for(let iy=gy-1;iy<=gy+1;iy++){
  if(!dug.has(ix+','+iy)&&!toDig.some(e=>e[0]===ix&&e[1]===iy)){toDig.push([ix,iy]);count++}
 }notify('⛏️ Назначена раскопка: '+count+' пикселей');return}
 if(view==='tree'&&Math.abs(p.x)<75&&p.y>370&&p.y<455){leaveTree();notify('🌿 Ты вышел из дерева');return}

 if(view==='nest'){let close=roomDefs.map(([id])=>({id,d:Math.hypot(p.x-roomLayout[id][0],p.y-roomLayout[id][1])})).sort((a,b)=>a.d-b.d)[0];if(close&&close.d<72){setPanel('build');notify('🏠 '+roomNames[close.id])}else notify('🪨 Здесь можно будет продолжить копать тоннель');return}
 let enemy=activeHostiles().find(v=>Math.hypot(v.x-p.x,v.y-p.y)<34);if(enemy){if(attackMode){state.armyTarget=enemy;state.armyOrder='attack';notify('🎯 Армии приказано атаковать цель!');attackMode=false;setPanel('');}else{state.target=enemy;state.pdest={x:enemy.x,y:enemy.y};notify('⚔️ Атака: '+({termWorker:'термит-рабочий',termSoldier:'термит-воин',spider:'паук',beetle:'жук',ladybug:'божья коровка',scorpion:'скорпион',mantis:'богомол',enemyAnt:'вражеский муравей'})[enemy.type])}return}

  let crystal=activeTree.pockets.find(v=>v.amount>0&&Math.hypot(v.x-p.x,v.y-p.y)<45);
  if(crystal){state.pdest={x:crystal.x,y:crystal.y};state.harvesting=crystal;notify('🟠 Месторождение смолы: '+fmt(crystal.amount));return;}
  state.target=null;state.harvesting=null;state.pdest=p;return;

 state.target=null;state.harvesting=null;state.pdest=p;cam.freeUntil=performance.now()+500;

function resize(){const r=game.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}new ResizeObserver(resize).observe(game);resize();
// Offline continuity for Safari / GitHub Pages. Saved state is compact and never contacts a server.
const SAVE_KEY='antEmpireNomadKingdomV6';let autosaveClock=0;
function storeGame(){
 try{
  const data={version:5,savedAt:Date.now(),R:{...R},rooms:JSON.parse(JSON.stringify(rooms)),sites:JSON.parse(JSON.stringify(sites)),roomLayout:JSON.parse(JSON.stringify(roomLayout)),
   player:{x:view==='tree'&&treeReturn?treeReturn.x:player.x,y:view==='tree'&&treeReturn?treeReturn.y:player.y,hp:player.hp},
   state:{...state,target:null,pdest:null,armyTarget:null,harvesting:null,events:state.events.slice(0,8)},
   workers:workers.map(a=>({x:a.x,y:a.y,job:a.job,hp:a.hp,max:a.max,speed:a.speed,walk:a.walk,dir:a.dir})),
   soldiers:soldiers.map(a=>({...a,target:null})),elites:elites.map(a=>({...a,target:null})),
   skills:{...skills},skillsDetailed:{...skillsDetailed},pendingReturns:{...pendingReturns},dug:[...dug],workMode};
  localStorage.setItem(SAVE_KEY,JSON.stringify(data));return true;
 }catch(err){return false}
}
function restoreGame(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
  const data=JSON.parse(raw);if(data.version!==6||!data.state||!data.R)return false;
  for(const k of Object.keys(R))R[k]=Math.max(0,Number(data.R[k])||0);
  for(const k of Object.keys(rooms))delete rooms[k];
  for(const [k,v] of Object.entries(data.rooms||{}))if(roomNames[k])rooms[k]=v;
  for(const k of Object.keys(sites))delete sites[k];Object.assign(sites,data.sites||{});if(data.roomLayout)for(const [k,pos] of Object.entries(data.roomLayout)){if(k in roomLayout&&Array.isArray(pos))roomLayout[k]=pos}
  Object.assign(state,data.state);state.target=null;state.pdest=null;state.harvesting=null;state.armyTarget=null;
  state.queenAlive=data.state.queenAlive!==false;
  player.x=data.player.x;player.y=data.player.y;player.hp=data.player.hp;
  workers.length=0;for(const a of data.workers||[])workers.push({...a,carry:null,target:null,delay:0,phase:'seek'});
  soldiers.length=0;for(const a of data.soldiers||[])soldiers.push(a);
  elites.length=0;for(const a of data.elites||[])elites.push(a);
  Object.assign(skills,data.skills||{});Object.assign(skillsDetailed,data.skillsDetailed||{});
  Object.assign(pendingReturns,data.pendingReturns||{});
  dug.clear();for(const q of data.dug||[])dug.add(q);
  workMode=data.workMode||'auto';return true;
 }catch(err){return false}
}
let accHUD=0,accMini=0;function loop(now){let dt=Math.min(.045,(now-last)/1000);last=now;const real=dt,sim=dt*scaleTime;if((view==='surface'||view==='tree')&&performance.now()>cam.freeUntil){let coef=Math.min(1,dt*3.4);cam.x+=(player.x-cam.x)*coef;cam.y+=(player.y-cam.y)*coef}if(view==='surface')tick(sim);else tick(sim);render();accHUD+=real;accMini+=real;if(accHUD>.35){updateHUD();accHUD=0;if(panel&&++dirtyPanel%3===0)drawPanel()}if(accMini>.48){miniDraw();accMini=0}autosaveClock+=real;if(autosaveClock>=20){autosaveClock=0;storeGame()}requestAnimationFrame(loop)}
window.addEventListener('pagehide',storeGame);const loadedSave=restoreGame();updateViewButtons();notify(loadedSave?'💾 Поселение восстановлено из сохранения.':'🐜 Колония основана! Нажимай на вход, чтобы войти в подземелье.',4000);updateHUD();miniDraw();requestAnimationFrame(loop);
})();
