/button></div></div><div id="panel" class="panel glass"></div></div><script>
(()=>{
'use strict';
const game=document.getElementById('game'),canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false}),mini=document.getElementById('minimap'),mc=mini.getContext('2d');
const $=id=>document.getElementById(id),PI=Math.PI,TAU=2*Math.PI;
let w=0,h=0,dpr=1,clock=0,renderT=0,last=performance.now(),zoom=1.12,cam={x:0,y:0,offsetX:0,offsetY:0,freeUntil:0},panel='',view='surface',toastTimeout=0,frame=0,scaleTime=1,attackMode=false,workMode='auto',digMode=false;
const R={mush:0,leaf:0,resin:0,nectar:0};
const digUnit=9,dug=new Set();let toDig=[],digProgress=0;
const sites={};let repairClock=0;let playerGather=0;

const state={hp:100,maxHp:100,playerX:0,playerY:26,pdest:null,target:null,lv:1,xp:0,sp:0,kills:0,queenHP:500,queenLv:1,day:1,time:0,armyOrder:'follow',armyTarget:null,eggClock:0,incClock:0,eggs:[],queue:[],events:[],research:0,repair:true,worked:0};
const roomDefs=[['queen','👑','Королевская'],['barracks','⚔️','Казармы'],['incubator','🥚','Инкубатор'],['fungus','🍄','Грибница'],['leaf','🍃','Склад листьев'],['resin','🟠','Склад смолы'],['nectar','🍯','Хранилище нектара'],['training','🥋','Тренировочная'],['hospital','❤️','Лечебница'],['lab','🔬','Лаборатория'],['guard','🛡️','Караульная'],['command','📯','Командная']];
const rooms={queen:{level:1,hp:1000},incubator:{level:1,hp:1000},fungus:{level:1,hp:1000},leaf:{level:1,hp:1000}};
const roomLayout={queen:[0,-32],incubator:[-135,-118],fungus:[130,-116],leaf:[-175,80],barracks:[175,82],resin:[-300,0],nectar:[300,-12],training:[-298,-212],hospital:[290,-213],lab:[-295,218],guard:[295,218],command:[0,220]};
const roomNames=Object.fromEntries(roomDefs.map(([id,icon,name])=>[id,name]));
const player={x:0,y:26,hp:100,dir:0,walk:0,hit:0};
const workers=Array.from({length:5},(_,i)=>({x:Math.cos(i*TAU/5)*34,y:26+Math.sin(i*TAU/5)*34,job:i<3?'mush':'leaf',dest:null,carry:null,target:null,phase:'seek',speed:70,walk:i,delay:i*.6, hp:100}));
const soldiers=[],elites=[];
const skills={attack:0,defense:0,speed:0,command:0};
const aiColonies=[{x:-1250,y:450,name:'Красные челюсти',size:90,relation:-100,known:false,scout:null,raid:[],phase:'scout',cooldown:0}];
const nodes=[],enemies=[],particles=[],floaters=[];
let eid=0;const exploredChunks=new Set();const pheromones=[];let pheromoneMark=0;
const rseed=(x,y,s=0)=>{let v=Math.sin(x*127.1+y*311.7+s*73.3)*43758.5453;return v-Math.floor(v)};
const rand=(a,b)=>a+Math.random()*(b-a);const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const fmt=n=>Math.floor(n).toLocaleString('ru-RU');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const notify=(msg,dur=3500)=>{const e=$('toast');e.textContent=msg;e.style.opacity=1;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.style.opacity=0,dur);state.events.unshift(msg);state.events.length=Math.min(state.events.length,8)};
const addNode=(kind,x,y,amount)=>nodes.push({kind,x,y,amount,max:amount,id:++eid,guard:false});
for(let i=0;i<14;i++){let a=TAU*i/14,rr=135+(i%4)*45;addNode(i%3===0?'leaf':'mush',Math.cos(a)*rr+rand(-22,22),Math.sin(a)*rr+rand(-22,22),i%3===0?1200:1500)}
for(let i=0;i<120;i++){let a=rand(0,TAU),rr=rand(300,2400),kind=Math.random()<.40?'leaf':'mush';addNode(kind,Math.cos(a)*rr,Math.sin(a)*rr,kind==='leaf'?1200:1500)}
addNode('resin',810,130,50000);addNode('nectar',-620,-450,500);
addNode('nectar',-650,-480,500);
for(let j=0;j<16;j++){let a=rand(0,TAU),rr=rand(350,2100);if(j%4===0)addNode('resin',Math.cos(a)*rr,Math.sin(a)*rr,50000)}
function extendWorld(){const cell=540,cx=Math.floor(player.x/cell),cy=Math.floor(player.y/cell);
 for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){
  const X=cx+dx,Y=cy+dy,key=X+','+Y;if(exploredChunks.has(key))continue;
  exploredChunks.add(key);if(X===0&&Y===0)continue;
  for(let i=0;i<9;i++){
   const x=(X+rseed(X*4+i,Y,6))*cell,y=(Y+rseed(X,Y*7+i,8))*cell;
   const n=rseed(X*13+i,Y*37+i,23);
   if(n<.52)addNode('mush',x,y,1500);
   else if(n<.985)addNode('leaf',x,y,1200);
   else if(n<.997)addNode('resin',x,y,50000);
   else addNode('nectar',x,y,500);
  }
 }}
function spawnEnemy(type,x,y){const stats={termWorker:[100,30,23],termSoldier:[200,50,28],spider:[600,120,35],beetle:[1600,150,26],ladybug:[1000,100,32],scorpion:[1000,200,36],mantis:[800,100,34],bee:[500,500,45],crab:[2000,100,24],cow:[20000,1000,10],child:[100000,2000,14],enemyAnt:[150,50,48]};let s=stats[type]||stats.termWorker;enemies.push({type,x,y,homeX:x,homeY:y,hp:s[0],max:s[0],dmg:s[1],speed:s[2],id:++eid,dir:0,walk:Math.random()*20,hit:0,attackTimer:0,agro:false,wanderT:0,tx:x,ty:y,signal:0});return enemies.at(-1)}
spawnEnemy('crab',-1080,-850);spawnEnemy('bee',-650,-485);spawnEnemy('cow',1440,1100);spawnEnemy('child',-1700,950);
const resinNode=nodes.find(n=>n.kind==='resin');for(let i=0;i<10;i++)spawnEnemy(i<6?'termWorker':'termSoldier',resinNode.x+rand(-80,80),resinNode.y+rand(-90,90));
spawnEnemy('spider',450,-250);spawnEnemy('beetle',-420,340);spawnEnemy('ladybug',-160,-510);spawnEnemy('scorpion',1120,-430);spawnEnemy('mantis',-890,630);
let spawnTermites=0,spawnScouts=0,dirtyPanel=0;
function setPanel(which){panel=panel===which?'':which;const p=$('panel');p.classList.toggle('open',!!panel);document.querySelectorAll('[data-panel]').forEach(b=>b.classList.toggle('active',b.dataset.panel===panel));if(panel)drawPanel()}
function capacities(){return {workers:(rooms.fungus?.level||0)*50,soldiers:(rooms.barracks?.level||0)*50,eggs:(rooms.incubator?.level||0)*3}}
function occupancy(){return soldiers.length+elites.length*5}
function buildCost(id){return id==='queen'?{resin:2000,nectar:500}:{leaf:2400}}
function enqueueAnt(kind){const cap=capacities();if(kind==='worker'&&workers.length+state.queue.filter(q=>q.kind==='worker').length>=cap.workers){notify('Грибница заполнена. Улучши её!');return}if(kind!=='worker'&&occupancy()+[...state.queue,...state.eggs].filter(q=>q.kind!=='worker').reduce((a,q)=>a+(q.kind==='elite'?5:1),0)+(kind==='elite'?5:1)>cap.soldiers){notify('В казарме не хватает мест! Построй казарму.');return}let cost=kind==='worker'?1:kind==='soldier'?15:200;if(R.mush<cost){notify('Нужно '+cost+' 🍄 грибных ресурсов');return}R.mush-=cost;state.queue.push({kind});notify('🥚 Заказ добавлен: '+({worker:'рабочий',soldier:'солдат',elite:'элитный листорез'}[kind]));drawPanel()}
function addUnit(kind){const a={x:rand(-28,28),y:rand(-28,28),hp:kind==='soldier'?150+(state.queenLv-1)*25:500+(state.queenLv-1)*50,max:kind==='soldier'?150+(state.queenLv-1)*25:500+(state.queenLv-1)*50,dmg:kind==='soldier'?50+(state.queenLv-1)*10:200+(state.queenLv-1)*20,walk:0,dir:0,target:null,kind,hit:0};if(kind==='worker'){a.hp=80;a.max=80;a.job='mush';a.carry=null;a.phase='seek';a.dest=null;a.speed=70;workers.push(a)}else if(kind==='soldier')soldiers.push(a);else elites.push(a);notify('🐜 Родился '+({worker:'рабочий',soldier:'солдат',elite:'элитный листорез'}[kind]));}
function nearestNode(kind,worker){let best=null,bs=1e99;for(const n of nodes)if(n.amount>0&&(n.kind===kind)){let dd=(n.x-worker.x)**2+(n.y-worker.y)**2;if(dd<bs){best=n;bs=dd}}return best}
function stepMove(a,tx,ty,speed,dt){let dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);if(d<1.2)return true;let move=Math.min(d,speed*dt);a.x+=dx/d*move;a.y+=dy/d*move;a.dir=Math.atan2(dy,dx)+PI/2;a.walk=(a.walk||0)+move*.1;return d<=move+1.5}
function emit(x,y,color,n=5,force=40){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-force,force),vy:rand(-force,force),life:rand(.28,.8),max:1,color,size:rand(1,3)})}
function attack(att,target,damage,dt){if(!target||target.hp<=0)return;target.hp-=damage*dt;if(Math.random()<dt*12){emit(target.x,target.y,'#efb064',1,16);if(Math.random()<.4)floaters.push({x:target.x,y:target.y,txt:'-'+Math.ceil(damage*.3),life:.7,color:'#ffbf80'})}att.hit=.14;if(target.hp<=0){if(enemies.includes(target)){enemies.splice(enemies.indexOf(target),1);state.kills++;let xp=target.type==='termWorker'?5:target.type==='termSoldier'?15:Math.ceil(target.max/20);state.xp+=xp;floaters.push({x:target.x,y:target.y,txt:'+'+xp+' XP',life:1,color:'#c9ff8d'});emit(target.x,target.y,'#d3ac75',15,90);let goal=70+state.lv*state.lv*22;while(state.xp>=goal){state.xp-=goal;state.lv++;state.sp++;state.maxHp+=4;player.hp=Math.min(state.maxHp,player.hp+24);notify('✨ Новый уровень '+state.lv+'! Очко навыков +1');goal=70+state.lv*state.lv*22}}}}
function tick(dt){clock+=dt;state.time+=dt;state.day=Math.floor(state.time/340)+1;extendWorld();
 if(state.pdest){if(stepMove(player,state.pdest.x,state.pdest.y,145+skills.speed*9,dt))state.pdest=null}
 if(state.harvesting&&state.harvesting.amount>0&&dist(player,state.harvesting)<39){playerGather+=dt;if(playerGather>=1){let n=Math.floor(playerGather);playerGather-=n;n=Math.min(n,state.harvesting.amount);state.harvesting.amount-=n;R[state.harvesting.kind]+=n;emit(player.x,player.y,'#f0d28c',2,10)}}
 if(state.target&&state.target.hp>0){let t=state.target,d=dist(player,t);if(d>32){state.pdest={x:t.x,y:t.y};}else{state.pdest=null;attack(player,t,(20+skills.attack*5),dt);if(Math.random()<dt*9)emit(t.x,t.y,'#f8df93',1)}}else state.target=null;
 for(const a of workers){a.delay=Math.max(0,(a.delay||0)-dt);if(a.delay>0)continue;

function buttonAction(action){if(action==='close'){setPanel(panel);return}if(action.startsWith('ant:')){enqueueAnt(action.split(':')[1]);return}if(action.startsWith('work:')){workMode=action.split(':')[1];notify('Рабочие: '+({auto:'автоматическое распределение',mush:'сбор грибов',leaf:'сбор листьев',resin:'сбор смолы',nectar:'сбор нектара'})[workMode]);drawPanel();return}if(action.startsWith('order:')){state.armyOrder=action.split(':')[1];state.armyTarget=null;attackMode=state.armyOrder==='attack';notify(attackMode?'🎯 Нажми на врага на карте':'Приказ: '+state.armyOrder);drawPanel();return}
 if(action.startsWith('skill:')){if(state.sp>0){state.sp--;skills[action.split(':')[1]]++;notify('✨ Навык улучшен!');drawPanel()}return}
 if(action.startsWith('build:')){const id=action.split(':')[1];if(rooms[id]||sites[id])return;const cost=buildCost(id);if(id==='queen'){notify('Королевская уже построена');return}sites[id]={need:cost.leaf,given:0,acc:0};notify('🏗️ Заказ на строительство: '+roomNames[id]);drawPanel();return}
 if(action.startsWith('cancel:')){const id=action.split(':')[1],site=sites[id];if(site){R.leaf+=site.given;delete sites[id];notify('Стройка отменена: листья возвращены');drawPanel()}return}
 if(action.startsWith('upgrade:')){let id=action.split(':')[1],rm=rooms[id];if(!rm||rm.level>=10)return;let cost=Math.floor(120*rm.level*rm.level);if(R.mush<cost){notify('Не хватает грибов!');return}R.mush-=cost;rm.level++;rm.hp=1000+(rm.level-1)*500;if(id==='queen'){state.queenLv=rm.level;state.queenHP=500+(rm.level-1)*100}notify('⬆️ '+roomNames[id]+': уровень '+rm.level);drawPanel();return}
 if(action==='repair'){state.repair=!state.repair;drawPanel()}}
$('panel').addEventListener('click',ev=>{let target=ev.target.closest('[data-action]');if(target)buttonAction(target.dataset.action)});
SPRITE_IMAGE.onload=()=>{
 document.querySelectorAll('[data-panel]').forEach(b=>{
 const data={colony:'iconColony',army:'iconArmy',build:'iconBuild',skills:'iconSkills',diplomacy:'iconDiplomacy',help:'iconEgg'}[b.dataset.panel];
 const i=b.querySelector('i');if(i)i.innerHTML=spriteUI(data,31);
 });
};
document.querySelectorAll('[data-panel]').forEach(e=>e.onclick=()=>setPanel(e.dataset.panel));
function changeView(v){view=v;$('surfaceBtn').classList.toggle('selected',v==='surface');$('nestBtn').classList.toggle('selected',v==='nest');cam.x=0;cam.y=0;cam.freeUntil=0;notify(v==='nest'?'🕳️ Подземелье — нажми на комнату':'🌿 Поверхность — отправляйся исследовать')}
$('digBtn').onclick=()=>{digMode=!digMode;$('digBtn').classList.toggle('selected',digMode);notify(digMode?'⛏️ Нажми на землю под муравейником, чтобы назначить раскопку':'Раскопка отключена')};$('surfaceBtn').onclick=()=>changeView('surface');$('nestBtn').onclick=()=>changeView('nest');
$('speedBtn').onclick=()=>{scaleTime=scaleTime===1?4:scaleTime===4?12:1;notify('Скорость времени ×'+scaleTime)};
$('zoomIn').onclick=()=>zoom=clamp(zoom*1.2,.55,2.25);$('zoomOut').onclick=()=>zoom=clamp(zoom/1.2,.55,2.25);$('autoBtn').onclick=()=>{workMode=workMode==='auto'?'mush':'auto';notify(workMode==='auto'?'Автоматическая добыча':'Добыча грибов');if(panel==='colony')drawPanel()};
const activePointers=new Map();let pointerStart=null,lastPinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pointerStart={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};lastPinch=null});
canvas.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===2){const [a,b]=[...activePointers.values()],dis=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch)zoom=clamp(zoom*dis/lastPinch,.55,2.25);lastPinch=dis;if(pointerStart)pointerStart.moved=true;return}if(!pointerStart)return;let dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y;if(Math.hypot(dx,dy)>7)pointerStart.moved=true;if(pointerStart.moved){cam.x=pointerStart.cx-dx/zoom;cam.y=pointerStart.cy-dy/zoom;cam.freeUntil=performance.now()+4000}});
canvas.addEventListener('pointerup',e=>{if(!activePointers.has(e.pointerId))return;activePointers.delete(e.pointerId);if(!pointerStart||pointerStart.moved){pointerStart=null;return}let rect=canvas.getBoundingClientRect(),p=screenToWorld(e.clientX-rect.left,e.clientY-rect.top);pointerStart=null;
 if(view==='nest'&&digMode){let gx=Math.floor(p.x/digUnit),gy=Math.floor(p.y/digUnit);let count=0;for(let ix=gx-1;ix<=gx+1;ix++)for(let iy=gy-1;iy<=gy+1;iy++){
  if(!dug.has(ix+','+iy)&&!toDig.some(e=>e[0]===ix&&e[1]===iy)){toDig.push([ix,iy]);count++}
 }notify('⛏️ Назначена раскопка: '+count+' пикселей');return}
 if(view==='nest'){let close=roomDefs.map(([id])=>({id,d:Math.hypot(p.x-roomLayout[id][0],p.y-roomLayout[id][1])})).sort((a,b)=>a.d-b.d)[0];if(close&&close.d<72){setPanel('build');notify('🏠 '+roomNames[close.id])}else notify('🪨 Здесь можно будет продолжить копать тоннель');return}
 let enemy=enemies.find(v=>Math.hypot(v.x-p.x,v.y-p.y)<34);if(enemy){if(attackMode){state.armyTarget=enemy;state.armyOrder='attack';notify('🎯 Армии приказано атаковать цель!');attackMode=false;setPanel('');}else{state.target=enemy;state.pdest={x:enemy.x,y:enemy.y};notify('⚔️ Атака: '+({termWorker:'термит-рабочий',termSoldier:'термит-воин',spider:'паук',beetle:'жук',ladybug:'божья коровка',scorpion:'скорпион',mantis:'богомол',enemyAnt:'вражеский муравей'})[enemy.type])}return}
 let node=nodes.find(v=>Math.hypot(v.x-p.x,v.y-p.y)<38);if(node){state.pdest={x:node.x,y:node.y};state.target=null;state.harvesting=node;notify('📍 '+({mush:'Гриб',leaf:'Листья',resin:'Смоляное дерево',nectar:'Нектарный цветок'})[node.kind]+' · остаток '+fmt(node.amount));return}
 state.target=null;state.harvesting=null;state.pdest=p;cam.freeUntil=performance.now()+500;
});canvas.addEventListener('pointercancel',e=>{activePointers.delete(e.pointerId);pointerStart=null});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.11:.9),.55,2.25)},{passive:false});
function resize(){const r=game.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}new ResizeObserver(resize).observe(game);resize();
let accHUD=0,accMini=0;function loop(now){let dt=Math.min(.045,(now-last)/1000);last=now;const real=dt,sim=dt*scaleTime;if(view==='surface'&&performance.now()>cam.freeUntil){let coef=Math.min(1,dt*3.4);cam.x+=(player.x-cam.x)*coef;cam.y+=(player.y-cam.y)*coef}if(view==='surface')tick(sim);else tick(sim);render();accHUD+=real;accMini+=real;if(accHUD>.35){updateHUD();accHUD=0;if(panel&&++dirtyPanel%3===0)drawPanel()}if(accMini>.48){miniDraw();accMini=0}requestAnimationFrame(loop)}
notify('🐜 Колония основана! 5 рабочих уже собирают ресурсы.',5000);updateHUD();miniDraw();requestAnimationFrame(loop);
})();
</script></body></html>
